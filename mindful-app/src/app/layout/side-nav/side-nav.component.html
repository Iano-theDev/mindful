<!-- <div class="card flex justify-center"> -->
<p-drawer #drawerRef [(visible)]='layoutService._drawerVisible' styleClass="w-auto">
    <ng-template #headless>


        <p-menu [model]="items" class="flex justify-center my-custom-menu" styleClass="w-auto">
            <ng-template #start>
                <div class="flex justify-content-start align-items-center gap-2 p-2">
                    <div>
                        <img src="assets/images/mindful-logo.png" alt="mindful logo"
                            style="border-radius: 50%; border: 2px solid white; width: 2.5rem; height: 2.5rem; object-fit: cover;">
                    </div>
                    <span class="font-semibold text-2xl text-cyan-700">Mindful</span>
                </div>
            </ng-template>

            <ng-template #submenuheader let-item>
                <span class="text-primary font-bold">{{ item.label }}</span>
            </ng-template>
            <ng-template #item let-item>
                <a pRipple class="flex items-center p-menu-item-link " (click)=onMenuItemClick(item)>
                    <span [class]="item.icon"></span>
                    <span class="ml-2">{{ item.label }}</span>
                    <p-badge *ngIf="item.badge" class="ml-auto" [value]="item.badge" />
                    <span *ngIf="item.shortcut"
                        class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">
                        {{ item.shortcut }}
                    </span>
                </a>
            </ng-template>
            <ng-template #end>
                
            </ng-template>
        </p-menu>
    </ng-template>

</p-drawer>
