<div class="mb-3 sticky top-0 z-5">
    <p-toast />
    <p-menubar [model]="">
        <ng-template #start>
            @if(authService.loggedIn()) {
            <div class="flex w-full justify-content-between align-items-center">
                <p-button (click)="layoutService.toggleDrawer()" icon="pi pi-bars" size="small"
                    severity="secondary"></p-button>
            </div>

            } @else {
            <div class="flex w-full justify-content-between align-items-center">
                <div class="flex justify-content-between align-items-center gap-2 p-2">
                    <div>
                        <img src="assets/images/mindful-logo.png" alt="mindful logo"
                            style="border-radius: 50%; border: 2px solid white; width: 2.5rem; height: 2.5rem; object-fit: cover;">
                    </div>
                    <span class="text-2xl text-green-500 hidden sm:block">Mindful</span>
                </div>
            </div>
            }
        </ng-template>

        <ng-template #end>
            <div class="flex items-center gap-2">
                <!-- <input type="text" pInputText placeholder="Search" class="w-36" /> -->
                <p-menu #menu [model]="avatarMenuItems" [popup]="true" />

                @if(!authService.isAuthenticated()) {
                <div class="flex items-center gap-1">
                    <!-- <p-button routerLink="/auth/login" label="Log In" icon="pi pi-sign-in" />
                    <p-button routerLink="/auth/signup" label="Sign Up" icon="pi pi-user-plus" /> -->
                    <!-- <p-button routerLink="/auth/login" 
                              label="Log In" 
                              icon="pi pi-sign-in" 
                              size="small"
                              class="hidden sm:block" />
                    <p-button routerLink="/auth/signup" 
                              label="Sign Up" 
                              icon="pi pi-user-plus" 
                              size="small"
                              class="hidden sm:block" /> -->
                    <p-button routerLink="/auth/login" [label]="'Log In'" icon="pi pi-sign-in" size="small"
                        class="text-xs sm:text-sm p-1 sm:p-2" severity="secondary" />
                    <p-button routerLink="/auth/signup" [label]="'Sign Up'" icon="pi pi-user-plus" size="small"
                        class="text-xs sm:text-sm p-1 sm:p-2" severity="secondary" />
                </div>
                } @else {
                <p-avatar (click)="menu.toggle($event)"
                    image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" />
                }
            </div>
        </ng-template>
    </p-menubar>
</div>
